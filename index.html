<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel Financeiro | Condomínio Alpha Garden</title>
<!--
==================================================================================
  PAINEL FINANCEIRO - CONDOMINIO ALPHA GARDEN  v2
  Para adicionar um mês: copie qualquer bloco dentro de MESES, cole com a chave
  "ANO-MES" (ex. "2026-05") e preencha os valores da folha. O painel atualiza tudo
  automaticamente: chips de navegação, deltas, gráficos, saúde e insights.
  Campos: fundos[saldoAnterior,créditos,débitos], banco{cc,cdb,vipdi,mov?},
  receitas[[nome,valor]], despesas[[nome,valor]],
  inadimplencia[[unidade,período,valor,tipo("J","A","")]].
==================================================================================
-->
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chartjs-plugin-datalabels/2.2.0/chartjs-plugin-datalabels.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap');

:root{
  --ink:#1a2420; --paper:#f0ede4; --card:#fff;
  --pine:#1f4d3a; --pine-soft:#2e6b50; --pine-xsoft:#e8f2ec;
  --brass:#a5771f; --brass-soft:#c9a24b; --brass-xsoft:#fdf3e0;
  --sage:#6e8b7a; --sage-light:#dce8e2;
  --positive:#1e7a4a; --pos-bg:#e6f4ec;
  --alert:#c0392b; --alert-bg:#fdecea;
  --warn:#d97706; --warn-bg:#fef3c7;
  --line:#e0dbd0; --muted:#727d73;
  --shadow:0 1px 3px rgba(26,36,32,.05),0 6px 24px rgba(26,36,32,.07);
  --r:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{font-family:'Inter',system-ui,sans-serif;background:var(--paper);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh}

/* ─── MASTHEAD ─── */
.masthead{background:var(--pine);padding:0 clamp(16px,4vw,48px);border-bottom:3px solid var(--brass);position:sticky;top:0;z-index:100}
.masthead-inner{display:flex;align-items:center;justify-content:space-between;gap:16px;height:58px}
.brand-eyebrow{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--brass-soft);font-weight:600;margin-bottom:1px}
.brand-name{font-family:'Fraunces',serif;font-weight:700;font-size:clamp(16px,2.5vw,22px);color:#fff;line-height:1}

/* ─── MONTH NAVIGATOR ─── */
.month-nav{background:#fff;border-bottom:1px solid var(--line);padding:0 clamp(16px,4vw,48px);overflow-x:auto;scrollbar-width:none}
.month-nav::-webkit-scrollbar{display:none}
.month-nav-inner{display:flex;align-items:stretch;gap:0;min-width:max-content;padding:10px 0}
.year-label{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.12em;padding:6px 14px 6px 4px;display:flex;align-items:center;white-space:nowrap}
.year-divider{width:1px;background:var(--line);margin:4px 10px}
.month-chip{background:none;border:1px solid transparent;border-radius:8px;padding:6px 12px;font-family:'Inter',sans-serif;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap;transition:all .15s;line-height:1}
.month-chip:hover{background:var(--pine-xsoft);color:var(--pine)}
.month-chip.active{background:var(--pine);color:#fff;border-color:var(--pine)}

/* ─── MODAL ─── */
.modal-overlay{position:fixed;inset:0;background:rgba(26,36,32,.55);z-index:500;display:flex;align-items:center;justify-content:center;padding:20px;animation:fadeIn .18s ease}
.modal-box{background:#fff;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.2);width:100%;max-width:780px;max-height:88vh;overflow:hidden;display:flex;flex-direction:column}
.modal-header{padding:20px 24px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.modal-title{font-family:'Fraunces',serif;font-size:19px;font-weight:700;color:var(--ink)}
.modal-close{background:none;border:none;font-size:22px;cursor:pointer;color:var(--muted);padding:4px 8px;border-radius:6px;line-height:1;transition:.15s}
.modal-close:hover{background:var(--line);color:var(--ink)}
.modal-body{padding:22px 24px;overflow-y:auto}
.modal-chart-wrap{position:relative;height:260px;margin-bottom:20px}
.modal-table{width:100%;border-collapse:collapse;font-size:13px}
.modal-table th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);padding:8px 10px;border-bottom:2px solid var(--line);font-weight:700}
.modal-table th.r,.modal-table td.r{text-align:right}
.modal-table td{padding:9px 10px;border-bottom:1px solid var(--line)}
.modal-table td.mono{font-family:'Space Grotesk',monospace;font-weight:600;font-variant-numeric:tabular-nums}
.modal-table tr.cur td{background:var(--pine-xsoft);font-weight:600}
.kpi-clickable{cursor:pointer;transition:transform .12s,box-shadow .12s}
.kpi-clickable:hover{transform:translateY(-2px);box-shadow:0 4px 20px rgba(31,77,58,.15)}
.kpi-hint{font-size:10.5px;color:var(--sage);margin-top:6px;display:flex;align-items:center;gap:3px}
/* 5-col reference KPI grid */
.g5ref{grid-template-columns:repeat(5,1fr)}
@media(max-width:1100px){.g5ref{grid-template-columns:repeat(3,1fr)}}
@media(max-width:700px){.g5ref{grid-template-columns:repeat(2,1fr)}}
@media(max-width:440px){.g5ref{grid-template-columns:1fr}}

/* ─── TABS ─── */
.tabs{background:#fff;border-bottom:1px solid var(--line);padding:0 clamp(16px,4vw,48px);display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:none;border-bottom:3px solid transparent;padding:14px 16px;font-family:'Inter',sans-serif;font-size:13.5px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap;transition:all .15s}
.tab:hover{color:var(--ink)}
.tab.active{color:var(--pine);border-bottom-color:var(--brass)}

/* ─── LAYOUT ─── */
main{padding:clamp(16px,3vw,36px) clamp(16px,4vw,48px);max-width:1280px;margin:0 auto}
.panel{display:none}
.panel.active{display:block;animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.panel.active{animation:none}}

.g{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:900px){.g4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:640px){.g2,.g3,.g4{grid-template-columns:1fr}}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.p20{padding:20px 22px}
.p24{padding:24px 26px}
.section-head{font-family:'Fraunces',serif;font-weight:700;font-size:17px;color:var(--ink);margin:28px 0 14px;display:flex;align-items:center;gap:10px}
.section-head .rule{flex:1;height:1px;background:var(--line)}

/* ─── KPI CARDS ─── */
.kpi-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.kpi-dot{width:7px;height:7px;border-radius:50%;flex:none}
.kpi-value{font-family:'Space Grotesk',monospace;font-weight:700;font-size:clamp(26px,4vw,36px);line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em;margin-bottom:8px}
.kpi-delta{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:600;padding:3px 9px;border-radius:999px;line-height:1.2}
.kpi-delta.up{background:var(--pos-bg);color:var(--positive)}
.kpi-delta.dn{background:var(--alert-bg);color:var(--alert)}
.kpi-delta.nt{background:var(--sage-light);color:var(--sage)}
.kpi-vs{font-size:11px;color:var(--muted);margin-top:4px}

/* ─── SAÚDE FINANCEIRA ─── */
.saude-grid{grid-template-columns:repeat(4,1fr)}
@media(max-width:860px){.saude-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){.saude-grid{grid-template-columns:1fr}}
.saude-card{padding:16px 18px;display:flex;align-items:center;gap:12px}
.saude-icon{font-size:20px;line-height:1;flex:none}
.saude-info{}
.saude-name{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.saude-status{font-size:14px;font-weight:600;margin-top:2px}
.saude-status.verde{color:var(--positive)}
.saude-status.amarelo{color:var(--warn)}
.saude-status.vermelho{color:var(--alert)}

/* ─── VERDICT BANNER ─── */
.verdict{background:linear-gradient(135deg,#1f4d3a,#173e2e);border-radius:var(--r);padding:22px 26px;color:#fff;margin-bottom:16px}
.verdict-eyebrow{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--brass-soft);font-weight:700;margin-bottom:8px}
.verdict-title{font-family:'Fraunces',serif;font-size:20px;font-weight:700;line-height:1.2;margin-bottom:6px}
.verdict-sub{font-size:13.5px;color:#c8dcd4;line-height:1.5}

/* ─── FLUXO DE CAIXA BARS ─── */
.flow-row{margin-bottom:14px}
.flow-row-head{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;margin-bottom:5px}
.flow-row-head .fl-label{font-weight:500;color:var(--ink)}
.flow-row-head .fl-val{font-family:'Space Grotesk',monospace;font-weight:600;font-size:13.5px;font-variant-numeric:tabular-nums}
.bar-track{height:10px;background:#f0ede4;border-radius:6px;overflow:hidden}
.bar-fill{height:100%;border-radius:6px;transition:width .4s}
.bar-green{background:linear-gradient(90deg,var(--pine),var(--pine-soft))}
.bar-red{background:linear-gradient(90deg,var(--alert),#e07060)}
.flow-result{border-top:1px dashed var(--line);margin-top:14px;padding-top:14px;display:flex;justify-content:space-between;align-items:center}
.flow-result-label{font-size:14px;font-weight:600}
.flow-result-val{font-family:'Space Grotesk',monospace;font-weight:700;font-size:22px;font-variant-numeric:tabular-nums}

/* ─── HORIZONTAL BAR LIST ─── */
.hbar-list{list-style:none}
.hbar-item{padding:10px 0;border-bottom:1px solid var(--line)}
.hbar-item:last-child{border-bottom:none}
.hbar-head{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px;gap:8px}
.hbar-name{font-weight:500;flex:1}
.hbar-right{display:flex;align-items:center;gap:8px;flex:none}
.hbar-val{font-family:'Space Grotesk',monospace;font-weight:600;font-variant-numeric:tabular-nums;font-size:13px}
.hbar-pct{font-size:11px;color:var(--muted);min-width:38px;text-align:right}
.hbar-track{height:6px;background:#f0ede4;border-radius:4px;overflow:hidden}
.hbar-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--pine),var(--pine-soft))}

/* ─── CHART CONTAINERS ─── */
.chart-card{padding:22px 24px}
.chart-card h3{font-size:14px;font-weight:700;margin-bottom:3px}
.chart-card .c-sub{font-size:12px;color:var(--muted);margin-bottom:16px}
.chart-wrap{position:relative}
.chart-wrap.h260{height:260px}
.chart-wrap.h300{height:300px}
.chart-wrap.h340{height:340px}

/* ─── FUNDOS ─── */
.fund-group{margin-bottom:20px}
.fund-group-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:10px;padding:0 2px}
.fund-card{padding:16px 18px}
.fund-name{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.fund-val{font-family:'Space Grotesk',monospace;font-weight:700;font-size:21px;margin:7px 0 5px;font-variant-numeric:tabular-nums;color:var(--pine)}
.fund-delta{font-size:12px;font-weight:600}
.fund-delta.up{color:var(--positive)}
.fund-delta.dn{color:var(--alert)}
.fund-delta.flat{color:var(--muted)}

/* ─── INADIMPLÊNCIA ─── */
.inad-kpi{padding:20px 22px}
.inad-kpi .ik-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.inad-kpi .ik-val{font-family:'Space Grotesk',monospace;font-weight:700;font-size:28px;margin:8px 0 0;font-variant-numeric:tabular-nums}
.inad-kpi.alert .ik-val{color:var(--alert)}
table.inad-table{width:100%;border-collapse:collapse;font-size:13px}
table.inad-table th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);padding:10px 12px;border-bottom:2px solid var(--line);font-weight:700}
table.inad-table th.r,table.inad-table td.r{text-align:right}
table.inad-table td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
table.inad-table td.mono{font-family:'Space Grotesk',monospace;font-weight:600;font-variant-numeric:tabular-nums}
table.inad-table tr.hot td{background:#fdf5f2}
.badge{font-size:10px;font-weight:700;padding:2px 6px;border-radius:5px;letter-spacing:.04em;margin-left:5px}
.badge.J{background:#fde8e5;color:var(--alert)}
.badge.A{background:var(--brass-xsoft);color:var(--brass)}

/* ─── EVOLUÇÃO STRIP ─── */
.evol-strip{grid-template-columns:repeat(4,1fr);margin-bottom:20px}
@media(max-width:860px){.evol-strip{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){.evol-strip{grid-template-columns:1fr}}
.es{padding:18px 20px}
.es-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.es-val{font-family:'Space Grotesk',monospace;font-weight:700;font-size:22px;margin:8px 0 4px;font-variant-numeric:tabular-nums}
.es-sub{font-size:12px;color:var(--muted)}
.es-sub.pos{color:var(--positive);font-weight:600}
.es-sub.neg{color:var(--alert);font-weight:600}

/* ─── INSIGHTS ─── */
.insight-item{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:12px}
.insight-item:last-child{border-bottom:none}
.insight-icon{font-size:18px;line-height:1;flex:none;margin-top:1px}
.insight-body{}
.insight-title{font-size:14px;font-weight:600;line-height:1.3}
.insight-sub{font-size:12.5px;color:var(--muted);margin-top:3px}
.insight-section{padding:4px 0}
.insight-section-head{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);padding:16px 16px 8px;border-bottom:1px solid var(--line)}

/* ─── PROJEÇÃO (future PO months) ─── */
.month-chip.projecao{border-style:dashed;opacity:.75}
.month-chip.projecao.active{opacity:1;background:var(--brass);border-color:var(--brass);border-style:solid}
.proj-banner{background:var(--brass-xsoft);border:1px solid var(--brass-soft);border-radius:var(--r);padding:14px 18px;font-size:13.5px;display:flex;gap:10px;align-items:flex-start;margin-bottom:16px}
.proj-banner b{color:var(--brass)}

/* ─── ORÇAMENTO TAB ─── */
.po-header{background:linear-gradient(135deg,#1a3a2a,#0f2318);border-radius:var(--r);padding:22px 26px;color:#fff;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px}
.po-header-title{font-family:'Fraunces',serif;font-size:18px;font-weight:700}
.po-header-sub{font-size:13px;color:#a0c4b0;margin-top:4px}
.po-kpis{display:flex;gap:24px;flex-wrap:wrap}
.po-kpi{text-align:right}
.po-kpi .pk-label{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--brass-soft)}
.po-kpi .pk-val{font-family:'Space Grotesk',monospace;font-weight:700;font-size:20px;color:#fff;font-variant-numeric:tabular-nums}

/* orcado vs realizado bar rows */
.ovr-row{padding:12px 0;border-bottom:1px solid var(--line)}
.ovr-row:last-child{border-bottom:none}
.ovr-head{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;margin-bottom:6px}
.ovr-label{font-weight:600}
.ovr-vals{display:flex;gap:14px;align-items:baseline;font-family:'Space Grotesk',monospace;font-variant-numeric:tabular-nums}
.ovr-orcado{font-size:12px;color:var(--muted)}
.ovr-real{font-size:14px;font-weight:700}
.ovr-diff{font-size:12px;font-weight:700;padding:1px 7px;border-radius:5px}
.ovr-diff.ok{background:var(--pos-bg);color:var(--positive)}
.ovr-diff.over{background:var(--alert-bg);color:var(--alert)}
.ovr-bars{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.ovr-bar-wrap{position:relative}
.ovr-bar-label{font-size:9px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:3px}
.ovr-track{height:8px;background:#f0ede4;border-radius:4px;overflow:hidden}
.ovr-fill-orc{height:100%;background:var(--line);border-radius:4px}
.ovr-fill-real{height:100%;border-radius:4px}
.ovr-fill-real.ok{background:linear-gradient(90deg,var(--positive),#4caf7d)}
.ovr-fill-real.over{background:linear-gradient(90deg,var(--alert),#e07060)}

/* PO monthly grid */
.po-month-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media(max-width:900px){.po-month-grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:640px){.po-month-grid{grid-template-columns:repeat(2,1fr)}}
.po-month-card{padding:16px 18px}
.po-mc-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.po-mc-val{font-family:'Space Grotesk',monospace;font-weight:700;font-size:22px;color:var(--pine);margin:6px 0 4px;font-variant-numeric:tabular-nums}
.po-mc-sub{font-size:11.5px;color:var(--muted)}
.po-mc-badge{font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px;margin-top:6px;display:inline-block}
.po-mc-badge.fut{background:var(--brass-xsoft);color:var(--brass)}

/* aderencia gauge */
.ader-pct{font-family:'Space Grotesk',monospace;font-weight:700;font-size:24px;font-variant-numeric:tabular-nums}
.ader-pct.ok{color:var(--positive)}
.ader-pct.warn{color:var(--warn)}
.ader-pct.over{color:var(--alert)}
.note{background:var(--brass-xsoft);border:1px dashed var(--brass-soft);border-radius:10px;padding:12px 16px;font-size:13px;display:flex;gap:10px;align-items:flex-start;margin-bottom:16px}
.note b{color:var(--brass)}
footer{text-align:center;font-size:11px;color:var(--muted);padding:24px 20px 40px}

@media print{
  .masthead,.month-nav,.tabs{display:none}
  .panel{display:block!important}
  body{background:#fff}
  .card{box-shadow:none}
}
</style>
</head>
<body>
<header class="masthead">
  <div class="masthead-inner">
    <div>
      <div class="brand-eyebrow">Demonstrativo Financeiro</div>
      <div class="brand-name">Condomínio Alpha Garden</div>
    </div>
  </div>
</header>

<nav class="month-nav" id="monthNav"></nav>

<nav class="tabs" id="tabs">
  <button class="tab active" data-tab="visao">Visão Geral</button>
  <button class="tab" data-tab="despesas">Despesas</button>
  <button class="tab" data-tab="reservas">Fundos & Reservas</button>
  <button class="tab" data-tab="inad">Inadimplência</button>
  <button class="tab" data-tab="evol">Evolução</button>
  <button class="tab" data-tab="insights">Insights</button>
  <button class="tab" data-tab="orcamento">Orçamento</button>
</nav>

<main>
  <section class="panel active" id="visao"></section>
  <section class="panel" id="despesas"></section>
  <section class="panel" id="reservas"></section>
  <section class="panel" id="inad"></section>
  <section class="panel" id="evol"></section>
  <section class="panel" id="insights"></section>
  <section class="panel" id="orcamento"></section>
</main>

<footer>Painel Financeiro · Condomínio Alpha Garden · Administradora Graiche · Os valores refletem exatamente as folhas de demonstrativo contábil.</footer>

<script>

// Full dataset. fundos: [saldoAnterior, creditos, debitos]; atual = ant+cred-deb
const MESES = {
  "2025-05": {
    mesLabel:"Maio 2025", periodo:"01/05/2025 a 31/05/2025",
    orcado:{total:205086, pessoal:134370, consumos:25930, contratos:13730, manutencoes:11600, higiene:4600, obrigacoes:3700, gerais:14750, receita:205086},
    fundos:{
      "Caixa Ordinário":[-37440.12,207439.29,220828.52],
      "Uso de Salões/Espaços":[31972.24,0,0],
      "Fundo de Reserva":[551075.80,113546.44,2027.06],

// Register datalabels plugin only for doughnut charts - will opt-in per chart
Chart.register(ChartDataLabels);

const BRL = new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'});
const fmt = v => BRL.format(v||0);
const fmtK = v => {
  const a=Math.abs(v);
  if(a>=1e6) return (v/1e6).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})+' mi';
  if(a>=1e3) return (v/1e3).toLocaleString('pt-BR',{minimumFractionDigits:0,maximumFractionDigits:0})+' mil';
  return v.toLocaleString('pt-BR');
};
const pct = (v,t) => t ? v/t*100 : 0;
const MES_ABBR = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
const curtoFromKey = k => { const[y,m]=k.split('-'); return MES_ABBR[+m-1]+'/'+y.slice(2); };

function computeMonth(key){
  const m = MESES[key];
  if(m.projecao){
    // Projection month — no realizado data
    return { key, ...m, curto:curtoFromKey(key),
      fundos:[], patAnt:0, patAtual:0, ord:{ant:0,cred:0,deb:0,atual:0},
      reservaFdR:0, totRec:0, totDesp:0, resultado:0, totInad:0, bancoTotal:0 };
  }
  const fundos = Object.entries(m.fundos).map(([nome,[ant,cred,deb]])=>({nome,ant,cred,deb,atual:ant+cred-deb}));
  const patAnt = fundos.reduce((s,f)=>s+f.ant,0);
  const patAtual = fundos.reduce((s,f)=>s+f.atual,0);
  const ord = fundos.find(f=>f.nome==="Caixa Ordinário");
  const reservaFdR = (fundos.find(f=>f.nome==="Fundo de Reserva")||{atual:0}).atual;
  const totRec = m.receitas.reduce((s,r)=>s+r[1],0);
  const totDesp = m.despesas.reduce((s,d)=>s+d[1],0);
  const totInad = m.inadimplencia.reduce((s,i)=>s+i[2],0);
  const banco = m.banco.cc + m.banco.cdb + m.banco.vipdi + (m.banco.mov||0);
  return { key, ...m, curto:curtoFromKey(key), fundos, patAnt, patAtual,
           ord, reservaFdR, totRec, totDesp, resultado:totRec-totDesp, totInad, bancoTotal:banco };
}

const keysSorted = Object.keys(MESES).sort();
let charts = {};
let activeKey = keysSorted[keysSorted.length-1];

function killCharts(){ Object.values(charts).forEach(c=>c&&c.destroy()); charts={}; }

/* ─── MODAL SYSTEM ─── */
let modalChart = null;
function openModal(html){
  closeModal();
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'theModal';
  overlay.innerHTML = `<div class="modal-box">${html}</div>`;
  overlay.addEventListener('click', e=>{ if(e.target===overlay) closeModal(); });
  document.body.appendChild(overlay);
}
function closeModal(){
  if(modalChart){ modalChart.destroy(); modalChart=null; }
  const el = document.getElementById('theModal');
  if(el) el.remove();
}

/* ─── DRILL-DOWN: série mensal de uma métrica ─── */
function drillModal(title, seriesLabel, valFn, color, fmt2, extraRows){
  const all = keysSorted.map(computeMonth);
  const labels = all.map(x=>x.curto);
  const vals = all.map(valFn);
  const rows = all.map((d,i)=>{
    const prev = i>0 ? vals[i-1] : null;
    const diff = prev!=null ? vals[i]-prev : null;
    const cls = d.key===activeKey ? 'cur' : '';
    const arrow = diff==null ? '—' : diff>=0 ? '▲' : '▼';
    const diffStr = diff==null ? '—' : (diff>=0?'+':'')+fmt2(diff);
    return `<tr class="${cls}"><td>${d.curto}${d.key===activeKey?' ●':''}</td><td class="r mono">${fmt2(vals[i])}</td><td class="r" style="color:${diff==null?'var(--muted)':diff>=0?'var(--positive)':'var(--alert)'}">${arrow} ${diffStr}</td></tr>`;
  }).join('');
  const extraHtml = extraRows ? extraRows(all, vals) : '';
  openModal(`
    <div class="modal-header">
      <div class="modal-title">${title}</div>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div class="modal-body">
      <div class="modal-chart-wrap"><canvas id="modalCanvas"></canvas></div>
      ${extraHtml}
      <table class="modal-table">
        <thead><tr><th>Mês</th><th class="r">Valor</th><th class="r">Variação</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`);
  requestAnimationFrame(()=>{
    const ctx = document.getElementById('modalCanvas');
    if(!ctx) return;
    modalChart = new Chart(ctx,{
      type:'line',
      data:{labels,datasets:[{
        label:seriesLabel, data:vals,
        borderColor:color, backgroundColor:color.replace(')',', .12)').replace('rgb(','rgba(').replace('#',null)||color+'26',
        fill:true, tension:.3, pointRadius:5, pointBackgroundColor:color, borderWidth:2.5
      }]},
      options:{
        plugins:{legend:{display:false},datalabels:{display:false},
          tooltip:{callbacks:{label:c=>' '+fmt2(c.raw)}}},
        scales:{
          y:{ticks:{callback:v=>fmt2(v).replace('R$\u00a0','R$ '),font:{family:'Inter',size:11}},grid:{color:'#eee'}},
          x:{ticks:{font:{family:'Inter',size:11}},grid:{display:false}}
        }
      }
    });
  });
}


function buildMonthNav(){
  const nav = document.getElementById('monthNav');
  const inner = document.createElement('div');
  inner.className = 'month-nav-inner';

  const years = {};
  keysSorted.forEach(k => {
    const y = k.slice(0,4);
    if(!years[y]) years[y]=[];
    years[y].push(k);
  });

  let first = true;
  Object.entries(years).forEach(([year, keys])=>{
    if(!first){ const div=document.createElement('div'); div.className='year-divider'; inner.appendChild(div); }
    first = false;
    const lbl = document.createElement('span');
    lbl.className = 'year-label';
    // Check if this year has projection months
    const hasProj = keys.some(k => MESES[k].projecao);
    lbl.textContent = year + (hasProj ? ' (PO)' : '');
    inner.appendChild(lbl);
    keys.forEach(k=>{
      const chip = document.createElement('button');
      const isProj = !!MESES[k].projecao;
      chip.className = 'month-chip' + (k===activeKey?' active':'') + (isProj?' projecao':'');
      chip.dataset.key = k;
      chip.textContent = MES_ABBR[+k.slice(5,7)-1];
      chip.title = MESES[k].mesLabel + (isProj ? ' · Projeção Orçamentária' : '');
      chip.addEventListener('click', ()=>{ activateMonth(k); });
      inner.appendChild(chip);
    });
  });
  nav.appendChild(inner);
}

function activateMonth(key){
  activeKey = key;
  document.querySelectorAll('.month-chip').forEach(c=>{
    c.classList.toggle('active', c.dataset.key===key);
  });
  renderAll(key);
}

/* ─── DELTA CHIP ─── */
function deltaChip(atual, ant, invertColor){
  if(ant==null) return '<span class="kpi-delta nt">Primeiro mês</span>';
  const diff = atual - ant;
  const p = ant ? diff/ant*100 : 0;
  const isPositive = invertColor ? diff<=0 : diff>=0;
  const cls = isPositive ? 'up' : 'dn';
  const arrow = diff>=0 ? '▲' : '▼';
  return `<span class="kpi-delta ${cls}">${arrow} ${Math.abs(p).toFixed(1)}%</span>`;
}

/* ─── SAÚDE FINANCEIRA ─── */
function calcSaude(d, dp){
  const items = [];

  // Caixa: verde se positivo, amarelo se entre 0 e 50k, vermelho se negativo
  const caixaOK = d.ord.atual;
  const caixaCls = caixaOK > 50000 ? 'verde' : caixaOK > 0 ? 'amarelo' : 'vermelho';
  const caixaIcon = caixaOK > 50000 ? '🟢' : caixaOK > 0 ? '🟡' : '🔴';
  items.push({icon:caixaIcon, name:'Caixa', status:caixaCls, label: caixaOK>50000?'Saudável':caixaOK>0?'Atenção':'Negativo'});

  // Resultado: verde se positivo, amarelo se até -20k, vermelho abaixo
  const resCls = d.resultado >= 0 ? 'verde' : d.resultado >= -30000 ? 'amarelo' : 'vermelho';
  const resIcon = d.resultado >= 0 ? '🟢' : d.resultado >= -30000 ? '🟡' : '🔴';
  items.push({icon:resIcon, name:'Resultado', status:resCls, label:d.resultado>=0?'Positivo':d.resultado>=-30000?'Atenção':'Déficit alto'});

  // Reservas: verde se crescendo ou estável, amarelo se caiu
  const reservaAnterior = dp ? dp.reservaFdR : null;
  const reservaCls = reservaAnterior==null||d.reservaFdR>=reservaAnterior ? 'verde' : 'amarelo';
  const reservaIcon = reservaCls==='verde' ? '🟢' : '🟡';
  items.push({icon:reservaIcon, name:'Reservas', status:reservaCls, label:reservaCls==='verde'?'Crescendo':'Redução'});

  // Inadimplência: verde se caiu vs anterior, amarelo se estável, vermelho se subiu >10%
  const inadAnterior = dp ? dp.totInad : null;
  let inadCls='verde', inadIcon='🟢', inadLabel='Reduzindo';
  if(inadAnterior!=null){
    const diff = d.totInad - inadAnterior;
    if(diff > inadAnterior*0.10){ inadCls='vermelho'; inadIcon='🔴'; inadLabel='Em alta'; }
    else if(diff > 0){ inadCls='amarelo'; inadIcon='🟡'; inadLabel='Leve alta'; }
    else { inadCls='verde'; inadIcon='🟢'; inadLabel='Reduzindo'; }
  } else { inadLabel='Sem anterior'; }
  items.push({icon:inadIcon, name:'Inadimplência', status:inadCls, label:inadLabel});

  return items;
}

/* ================================================================
   RENDER: FUNDOS & RESERVAS
================================================================ */
function renderReservas(d, dp){
  const fundoGroups = {
    'Operacional': ['Caixa Ordinário'],
    'Reserva Obrigatória': ['Fundo de Reserva'],
    'Reservas Específicas': ['Piscina','Melhoramentos','Pinturas','Uso de Salões/Espaços','Seguro Proteção Res+']
  };

  const fundoCards = (names) => names.map(nome=>{
    const f = d.fundos.find(x=>x.nome===nome);
    if(!f || Math.abs(f.atual)<1) return '';
    const ant = dp ? (dp.fundos.find(x=>x.nome===nome)||{}).atual : null;
    let cls='flat', lbl='—';
    if(ant!=null){
      const diff=f.atual-ant;
      if(Math.abs(diff)<1){ cls='flat'; lbl='Estável'; }
      else if(diff>0){ cls='up'; lbl='▲ '+fmt(diff); }
      else { cls='dn'; lbl='▼ '+fmt(Math.abs(diff)); }
    }
    return `<div class="card fund-card kpi-clickable" data-fund="${nome}" title="Ver histórico de ${nome}">
      <div class="fund-name">${nome}</div>
      <div class="fund-val">${fmt(f.atual)}</div>
      <div class="fund-delta ${cls}">${lbl}</div>
      <div class="kpi-hint">📈 Ver histórico</div>
    </div>`;
  }).filter(Boolean).join('');

  const groupsHtml = Object.entries(fundoGroups).map(([label,names])=>{
    const cards = fundoCards(names);
    if(!cards) return '';
    return `<div class="fund-group">
      <div class="fund-group-label">${label}</div>
      <div class="g g3">${cards}</div>
    </div>`;
  }).join('');

  document.getElementById('reservas').innerHTML = `
    <div class="g g2" style="align-items:start;margin-bottom:16px">
      <div class="card chart-card">
        <h3>Composição do patrimônio</h3>
        <div class="c-sub">Total ${fmt(d.patAtual)} · participação por fundo</div>
        <div class="chart-wrap h300"><canvas id="chartFundos"></canvas></div>
      </div>
      <div class="card chart-card">
        <h3>Posição bancária · Itaú Ag. 0024</h3>
        <div class="c-sub">Como o dinheiro está aplicado</div>
        <div class="chart-wrap h300"><canvas id="chartBanco"></canvas></div>
      </div>
    </div>
    <div class="section-head">Saldo por fundo <span class="rule"></span></div>
    ${groupsHtml}`;

  const visiveis = d.fundos.filter(f=>f.atual>1).sort((a,b)=>b.atual-a.atual);
  charts.fundos = new Chart(document.getElementById('chartFundos'),{
    type:'doughnut',
    data:{labels:visiveis.map(f=>f.nome),datasets:[{data:visiveis.map(f=>f.atual),
      backgroundColor:['#1f4d3a','#2e6b50','#6e8b7a','#a5771f','#c9a24b','#8fae9c','#d8d2c2'],
      borderWidth:2,borderColor:'#fff'}]},
    options:{cutout:'52%',plugins:{
      legend:{position:'bottom',labels:{boxWidth:11,font:{family:'Inter',size:11},padding:10}},
      tooltip:{callbacks:{label:c=>' '+fmt(c.raw)+' ('+pct(c.raw,d.patAtual).toFixed(1)+'%)'}},
      datalabels:{
        color:'#fff', font:{family:'Inter',size:10,weight:'700'},
        formatter:(v,ctx)=>{
          const p=pct(v,d.patAtual);
          return p>=5 ? p.toFixed(0)+'%' : '';
        },
        anchor:'center', align:'center', textShadowBlur:4, textShadowColor:'rgba(0,0,0,.4)'
      }
    }}
  });

  const bLabels=['Conta corrente','Aplicação CDB','VIP DI (Reserva)'];
  const bVals=[d.banco.cc,d.banco.cdb,d.banco.vipdi];
  const bColors=['#6e8b7a','#2e6b50','#1f4d3a'];
  if(d.banco.mov){ bLabels.push('Em movimentação'); bVals.push(d.banco.mov); bColors.push('#c9a24b'); }
  charts.banco = new Chart(document.getElementById('chartBanco'),{
    type:'bar',
    data:{labels:bLabels,datasets:[{data:bVals,backgroundColor:bColors,borderRadius:8,barThickness:40}]},
    options:{plugins:{legend:{display:false},datalabels:{display:false},tooltip:{callbacks:{label:c=>' '+fmt(c.raw)}}},
      scales:{y:{ticks:{callback:v=>'R$ '+fmtK(v),font:{family:'Inter',size:11}},grid:{color:'#eee'}},
              x:{ticks:{font:{family:'Inter',size:11}},grid:{display:false}}}}
  });

  // Wire clickable fund cards
  document.querySelectorAll('[data-fund]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const nome = el.dataset.fund;
      drillModal(
        nome+' · Histórico mensal', nome,
        x=>{ const f=x.fundos.find(f=>f.nome===nome); return f?f.atual:null; },
        '#1f4d3a', fmt
      );
    });
  });
}

function renderOrcamento(){

    const o=d.orcado; const pctR=d.totDesp/o.total*100; const diff=d.totDesp-o.total;

        <div class="po-kpi"><div class="pk-label">Total anual</div><div class="pk-val">R$ ${(poAnnual/1e6).toFixed(2)}M</div></div>
        <div class="po-kpi"><div class="pk-label">Cota proposta</div><div class="pk-val">${fmt(216188)}</div></div>
        <div class="po-kpi"><div class="pk-label">Reajuste</div><div class="pk-val">+5,4%</div></div>
      </div>
    </div>
    <div class="section-head">Realizado vs Orçado · histórico + projeção <span class="rule"></span></div>
    <div class="card chart-card" style="margin-bottom:20px">
      <div class="chart-wrap h300"><canvas id="cPoEvol"></canvas></div>
    </div>
    <div class="section-head">Aderência · últimos 6 meses realizados <span class="rule"></span></div>
    <div class="card chart-card" style="margin-bottom:20px">
      <table class="inad-table">
        <thead><tr><th>Mês</th><th class="r">Orçado</th><th class="r">Realizado</th><th class="r">Variação</th><th class="r">Aderência</th></tr></thead>
        <tbody>${aderRows}</tbody>
      </table>
      <div style="font-size:11px;color:var(--muted);margin-top:12px">✅ ≤100% · 🟡 101–115% · 🔴 >115% · Orçado base R$ 205.086</div>
    </div>
    <div class="g g2" style="margin-bottom:20px">
      <div><div class="section-head">Composição média orçada <span class="rule"></span></div>
        <div class="card chart-card"><div class="chart-wrap h260"><canvas id="cPoComp"></canvas></div></div>
      </div>
      <div><div class="section-head">Detalhamento PO por mês <span class="rule"></span></div>
        <div class="po-month-grid" style="grid-template-columns:repeat(2,1fr)">${poMonthCards}</div>
      </div>
    </div>`;

  requestAnimationFrame(()=>{
    const dl2={datalabels:{display:false}};
    const aY={ticks:{callback:v=>'R$ '+fmtK(v),font:{family:'Inter',size:11}},grid:{color:'#eee'}};
    const aX={ticks:{font:{family:'Inter',size:11}},grid:{display:false}};
    charts.poEvol=new Chart(document.getElementById('cPoEvol'),{
      data:{labels:keysSorted.map(curtoFromKey),datasets:[
        {type:'bar',label:'Realizado',data:realData,backgroundColor:'rgba(192,57,43,.65)',borderRadius:4},
        {type:'line',label:'Orçado (PO)',data:orcData,borderColor:'#a5771f',borderDash:[6,3],fill:false,tension:.1,pointRadius:3,borderWidth:2.5,pointStyle:'triangle'}
      ]},
      options:{plugins:{legend:{position:'bottom',labels:{font:{family:'Inter',size:12},boxWidth:12,padding:14}},...dl2,tooltip:{callbacks:{label:c=>' '+c.dataset.label+': '+fmt(c.raw)}}},scales:{y:aY,x:aX}}
    });
    const avgCats=cats.map((c,i)=>({label:catLabels[i],val:poKeys.reduce((s,k)=>s+MESES[k].orcado[c],0)/poKeys.length}));
    charts.poComp=new Chart(document.getElementById('cPoComp'),{
      type:'doughnut',
      data:{labels:avgCats.map(c=>c.label),datasets:[{data:avgCats.map(c=>c.val),backgroundColor:['#1f4d3a','#2e6b50','#6e8b7a','#a5771f','#c9a24b','#8fae9c','#d8d2c2'],borderWidth:2,borderColor:'#fff'}]},
      options:{cutout:'52%',plugins:{legend:{position:'bottom',labels:{boxWidth:11,font:{family:'Inter',size:11},padding:10}},
        tooltip:{callbacks:{label:c=>' '+fmt(c.raw)+' ('+pct(c.raw,poAvg).toFixed(1)+'%)'}},
        datalabels:{color:'#fff',font:{family:'Inter',size:10,weight:'700'},formatter:(v,ctx)=>{const p=pct(v,poAvg);return p>=5?p.toFixed(0)+'%':'';},anchor:'center',align:'center',textShadowBlur:4,textShadowColor:'rgba(0,0,0,.4)'}}}
    });
  });
}

/* ================================================================
   RENDER: INSIGHTS
================================================================ */
function renderInsights(d, dp){
  const all = keysSorted.map(computeMonth);
  const items = [];

  // Patrimônio
  if(dp){
    const diff = d.patAtual - dp.patAtual;
    const p = dp.patAtual ? diff/dp.patAtual*100 : 0;
    const ok = diff >= 0;
    items.push({section:'Patrimônio', icon:ok?'✅':'⚠️', cls:ok?'pos':'warn',
      title:`Patrimônio ${ok?'cresceu':'recuou'} ${Math.abs(p).toFixed(1)}% no mês`,
      sub:`${fmt(dp.patAtual)} → ${fmt(d.patAtual)} · variação de ${ok?'+':''}${fmt(diff)}`});
  }

  // Resultado
  const resOk = d.resultado >= 0;
  items.push({section:'Resultado', icon:resOk?'✅':'⚠️',
    title:`Resultado do mês: ${resOk?'+':''}${fmt(d.resultado)}`,
    sub:resOk?`Entradas superaram saídas em ${fmt(d.resultado)}`:`Saídas superaram entradas em ${fmt(Math.abs(d.resultado))}`});

  // Fundo de Reserva
  const fdr = d.fundos.find(f=>f.nome==="Fundo de Reserva");
  const fdrAnt = dp ? (dp.fundos.find(f=>f.nome==="Fundo de Reserva")||{}).atual : null;
  if(fdr && fdrAnt!=null){
    const diff = fdr.atual - fdrAnt;
    items.push({section:'Reservas', icon: diff>=0?'✅':'⚠️',
      title:`Fundo de Reserva ${diff>=0?'cresceu':'recuou'} ${fmt(Math.abs(diff))}`,
      sub:`Saldo atual: ${fmt(fdr.atual)}`});
  }

  // Inadimplência
  if(dp){
    const diff = d.totInad - dp.totInad;
    const ok = diff <= 0;
    items.push({section:'Inadimplência', icon:ok?'✅':'⚠️',
      title:`Inadimplência ${ok?'reduziu':'aumentou'} ${fmt(Math.abs(diff))}`,
      sub:`${fmt(dp.totInad)} → ${fmt(d.totInad)} · ${d.inadimplencia.length} unidades em aberto`});
  }

  // Maior despesa
  const topDesp = [...d.despesas].sort((a,b)=>b[1]-a[1])[0];
  if(topDesp){
    items.push({section:'Despesas', icon:'ℹ️',
      title:`Maior categoria: ${topDesp[0]}`,
      sub:`${fmt(topDesp[1])} · ${pct(topDesp[1],d.totDesp).toFixed(1)}% do total de despesas`});
  }

  // Variação de despesas vs mês anterior
  if(dp){
    const diff = d.totDesp - dp.totDesp;
    const p = dp.totDesp ? diff/dp.totDesp*100 : 0;
    const ok = diff <= 0;
    items.push({section:'Despesas', icon:ok?'✅':'⚠️',
      title:`Despesas ${ok?'reduziram':'aumentaram'} ${Math.abs(p).toFixed(1)}% vs mês anterior`,
      sub:`${fmt(dp.totDesp)} → ${fmt(d.totDesp)}`});
  }

  // Evolução do patrimônio no período completo
  const first = all[0];
  const patTotal = d.patAtual - first.patAnt;
  const patPct = first.patAnt ? patTotal/first.patAnt*100 : 0;
  items.push({section:'Período', icon:'📈',
    title:`Patrimônio acumulou ${patTotal>=0?'+':''}${fmt(patTotal)} desde ${first.curto}`,
    sub:`${fmt(first.patAnt)} → ${fmt(d.patAtual)} · alta de ${patPct.toFixed(0)}%`});

  // Inadimplência no período
  const inadFirst = first.totInad;
  const inadDiff = d.totInad - inadFirst;
  const inadOk = inadDiff <= 0;
  items.push({section:'Período', icon:inadOk?'✅':'⚠️',
    title:`Inadimplência ${inadOk?'caiu':'subiu'} ${fmt(Math.abs(inadDiff))} desde ${first.curto}`,
    sub:`${fmt(inadFirst)} → ${fmt(d.totInad)}`});

  // Group by section
  const sections = {};
  items.forEach(i=>{ if(!sections[i.section]) sections[i.section]=[]; sections[i.section].push(i); });

  const secIcons = {Patrimônio:'💰',Resultado:'📊',Reservas:'🏦',Inadimplência:'⚠',Despesas:'💸',Período:'📅'};
  const html = Object.entries(sections).map(([sec, its])=>`
    <div class="insight-section">
      <div class="insight-section-head">${secIcons[sec]||'•'} ${sec}</div>
      ${its.map(i=>`
        <div class="insight-item">
          <div class="insight-icon">${i.icon}</div>
          <div class="insight-body">
            <div class="insight-title">${i.title}</div>
            ${i.sub?`<div class="insight-sub">${i.sub}</div>`:''}
          </div>
        </div>`).join('')}
    </div>`).join('');

  document.getElementById('insights').innerHTML = `
    <div class="section-head">Resumo executivo · ${d.mesLabel} <span class="rule"></span></div>
    <div class="card">${html}</div>`;
}

/* ================================================================
   MASTER RENDER
================================================================ */
function renderAll(key){
  killCharts();
  const d = computeMonth(key);
  const prev = keysSorted[keysSorted.indexOf(key)-1];
  const dp = prev ? computeMonth(prev) : null;
  renderVisao(d, dp);
  renderDespesas(d);
  if(!d.projecao){ renderReservas(d, dp); renderInad(d); }
  else {
    document.getElementById('reservas').innerHTML='<div class="proj-banner" style="margin-top:8px"><span>📋</span><div>Mês de projeção — dados de fundos e inadimplência não disponíveis.</div></div>';
    document.getElementById('inad').innerHTML='<div class="proj-banner" style="margin-top:8px"><span>📋</span><div>Mês de projeção — dados de inadimplência não disponíveis.</div></div>';
  }
  renderEvol(key);
  renderInsights(d, dp);
  renderOrcamento();
}

/* ================================================================
   INIT
================================================================ */
buildMonthNav();

document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeModal(); });

document.getElementById('tabs').addEventListener('click', e=>{
  const btn = e.target.closest('.tab'); if(!btn) return;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById(btn.dataset.tab).classList.add('active');
});

renderAll(activeKey);
</script>
